<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V4 禅修经证全量索引</title>
<style>
:root{color-scheme:light;--paper:#f6f1e8;--ink:#352d25;--muted:#786e63;--gold:#a96e28;--line:#decdb4;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}main{max-width:1180px;margin:0 auto;padding:30px 22px 80px}header{background:linear-gradient(135deg,#fffdf8,#f0e2cd);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 28px #80613a15}h1{margin:0 0 8px;font-family:Georgia,"Noto Serif SC",serif;letter-spacing:.03em}p{line-height:1.75}.meta{color:var(--muted);font-size:14px}.controls{position:sticky;top:10px;z-index:2;margin:18px 0;padding:14px;background:#fffdf8ee;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 160px 220px auto;gap:10px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffdf8;color:var(--ink)}button{cursor:pointer;background:#a96e28;color:#fff;border-color:#a96e28}.status{color:var(--muted);font-size:14px;padding:8px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #80613a10}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title{font-weight:700}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ead8bb;color:#76501e;font-size:12px}.path{color:var(--muted);font-size:13px;margin-top:5px}.hit{color:#7f4a14;font-size:13px;margin:10px 0}.quote{white-space:pre-wrap;border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;line-height:1.7}.quote.pali{font-family:Georgia,serif;font-style:italic}.quote.en{color:#655c53}.quote:empty{display:none}.actions a{color:var(--gold);font-weight:600}.pager{display:flex;justify-content:center;gap:10px;margin:22px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@media(max-width:760px){.controls{position:static;grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.head{display:block}.actions{margin-top:10px}}
</style></head><body><main><header><h1>V4 全层禅修经证 · 全量索引</h1><p>这是讲座的完整机器筛选候选库，不把关键词命中直接当作结论。每条记录保留巴利、简体中文、英文、作品层级、命中词和稳定阅读器定位；“词汇相关／待复核”项也保留，便于人工审查。</p><div id="meta" class="meta">正在加载压缩证据库……</div></header><section class="controls"><input id="q" placeholder="检索术语、作品、巴利、中文或英文" autocomplete="off"><select id="layer"><option value="">全部语料层</option><option value="根本三藏">根本三藏</option><option value="义注">义注</option><option value="复注">复注</option><option value="藏外典籍">藏外典籍</option></select><select id="class"><option value="">全部审核分类</option><option value="direct_practice_or_method">直接修习／方法</option><option value="conditions_or_insight_context">条件／观慧上下文</option><option value="lexical_context_requires_review">词汇相关／待复核</option></select><button id="reset">清除筛选</button></section><div id="status" class="status"></div><section id="results"></section><nav class="pager"><button id="prev">上一页</button><span id="page">1</span><button id="next">下一页</button></nav></main>
<script>
const state={rows:[],filtered:[],page:1,size:20};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function apply(){const q=$('q').value.trim().toLowerCase(),layer=$('layer').value,cls=$('class').value;state.filtered=state.rows.filter(r=>{const hay=[r.title,r.work_id,(r.path||[]).join(' '),r.text_pali,r.text_zh,r.text_en,(r.query_hits||[]).map(h=>h.term).join(' ')].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!layer||r.corpus_layer_label===layer)&&(!cls||r.evidence_class===cls)});state.page=1;render()}
function render(){const start=(state.page-1)*state.size,items=state.filtered.slice(start,start+state.size);$('status').textContent='显示 '+(state.filtered.length?start+1:0)+'–'+Math.min(start+state.size,state.filtered.length)+' / '+state.filtered.length+' 条；完整候选共 '+state.rows.length+' 条';$('page').textContent=state.page+' / '+Math.max(1,Math.ceil(state.filtered.length/state.size));$('prev').disabled=state.page<=1;$('next').disabled=state.page>=Math.ceil(state.filtered.length/state.size);$('results').innerHTML=items.length?items.map(r=>{const hits=(r.query_hits||[]).map(h=>h.language+':'+h.term).join(' · '),before=r.context&&r.context.before||{},after=r.context&&r.context.after||{};return '<article class="card"><div class="head"><div><div class="title">'+esc(r.title||r.work_id)+' · '+esc(r.paranum||r.row_id)+'</div><div class="path">'+esc((r.path||[]).join(' / '))+' · '+esc(r.work_id)+':'+esc(r.row_id)+'</div></div><div><span class="badge">'+esc(r.corpus_layer_label)+'</span> <span class="badge">'+esc(r.evidence_class)+'</span></div></div><div class="hit">命中：'+esc(hits)+'</div><div class="quote pali">'+esc(r.text_pali)+'</div><div class="quote">'+esc(r.text_zh)+'</div><div class="quote en">'+esc(r.text_en)+'</div><details><summary>显示前后相邻行</summary><div class="path">前一行 '+esc(before.row_id||'')+'</div><div class="quote pali">'+esc(before.text_pali||'')+'</div><div class="quote">'+esc(before.text_zh||'')+'</div><div class="quote en">'+esc(before.text_en||'')+'</div><div class="path">后一行 '+esc(after.row_id||'')+'</div><div class="quote pali">'+esc(after.text_pali||'')+'</div><div class="quote">'+esc(after.text_zh||'')+'</div><div class="quote en">'+esc(after.text_en||'')+'</div></details><div class="actions"><a href="'+esc(r.reader_url)+'" target="_blank" rel="noopener">打开 V4 阅读器定位此行 →</a></div></article>'}).join(''):'<div class="empty">没有符合条件的候选。可以放宽术语或语料层筛选。</div>'}
['q','layer','class'].forEach(id=>$(id).addEventListener('input',apply));$('reset').onclick=()=>{['q','layer','class'].forEach(id=>$(id).value='');apply()};$('prev').onclick=()=>{if(state.page>1){state.page--;render()}};$('next').onclick=()=>{if(state.page<Math.ceil(state.filtered.length/state.size)){state.page++;render()}};
async function load(){try{const indexResponse=await fetch('evidence-shards.json');if(!indexResponse.ok)throw new Error('HTTP '+indexResponse.status);const index=await indexResponse.json();const loadShard=async file=>{const response=await fetch(file);if(!response.ok)throw new Error(file+' HTTP '+response.status);const stream=response.body.pipeThrough(new DecompressionStream('gzip'));return new Response(stream).json()};const shards=await Promise.all(index.files.map(item=>loadShard(item.file)));state.rows=shards.flat();}catch(error){$('meta').textContent='无法读取分片证据库：'+error.message+'。请使用支持 gzip DecompressionStream 的现代浏览器。';return}state.filtered=state.rows;$('meta').textContent=state.rows.length.toLocaleString()+' 条候选 · 217 部作品 · 四层语料 · 109 个受控词条';render()}
load();
</script></body></html>
